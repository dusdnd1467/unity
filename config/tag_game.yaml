      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 256
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.003
        network_settings:
          hidden_units: 128
          num_layers: 2
        learning_rate: 3.0e-4
    max_steps: 10000000
    time_horizon: 256
    summary_freq: 10000
    keep_checkpoints: 5

